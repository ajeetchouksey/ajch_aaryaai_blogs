name: Validate blog content
on:
  pull_request:
    paths:
      - 'content/blog/**'
      - 'scripts/validate-content.mjs'
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'scripts/validate-content.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate content schema
        shell: bash
        run: |
          shopt -s nullglob
          node scripts/validate-content.mjs content/blog/index.json content/blog/posts/*.md
